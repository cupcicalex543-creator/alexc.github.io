<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Site Informativ</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #34495e;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        .container {
            padding: 20px;
        }

        .box {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Site Informativ</h1>
    <p>Un exemplu de site creat pe GitHub Pages</p>
</header>

<nav>
    <a href="#">Acasă</a>
    <a href="#">Despre</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <div class="box">
        <h2>Despre acest site</h2>
        <p>Acesta este un site informativ simplu, creat cu HTML și CSS.</p>
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f" alt="imagine">
    </div>

    <div class="box">
        <h2>Informații utile</h2>
        <p>Aici poți adăuga orice text: istorie, biologie, fizică etc.</p>
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="imagine">
    </div>

</div>

<footer>
    © 2026 Site creat de tine
</footer>

</body>
</html>
